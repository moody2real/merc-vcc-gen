name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build cross-platform binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          build() {
            local goos="$1" goarch="$2" out="$3"
            echo "Building ${goos}/${goarch} -> ${out}"
            GOOS="${goos}" GOARCH="${goarch}" go build -ldflags "-s -w" -o "dist/${out}" ./cmd/merc
          }
          build windows amd64 merc-windows-amd64.exe
          build linux   amd64 merc-linux-amd64
          build darwin  amd64 merc-darwin-amd64
          build darwin  arm64 merc-darwin-arm64

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Requires a repo secret named VIRUSTOTAL_API_KEY.
      # Add it under Settings -> Secrets and variables -> Actions.
      # Without the secret this step is skipped and the release still succeeds.
      - name: Upload binaries to VirusTotal
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if [ -z "${VIRUSTOTAL_API_KEY}" ]; then
            echo "VIRUSTOTAL_API_KEY not set; skipping VirusTotal scan."
            exit 0
          fi
          : > dist/VIRUSTOTAL.txt
          echo "## VirusTotal scans" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/merc-*; do
            name="$(basename "$f")"
            echo "Uploading ${name} to VirusTotal..."
            id="$(curl -s -X POST https://www.virustotal.com/api/v3/files \
              --header "x-apikey: ${VIRUSTOTAL_API_KEY}" \
              --form "file=@${f}" | jq -r '.data.id')"
            if [ -z "${id}" ] || [ "${id}" = "null" ]; then
              echo "Failed to upload ${name}"
              echo "${name}: upload failed" >> dist/VIRUSTOTAL.txt
              continue
            fi
            url="https://www.virustotal.com/gui/file-analysis/${id}"
            echo "${name}: ${url}"
            echo "${name}: ${url}" >> dist/VIRUSTOTAL.txt
            echo "- ${name}: ${url}" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            Cross-platform binaries for merc-vcc-gen.

            Verify downloads against the SHA256 checksums in `SHA256SUMS.txt`.

            VirusTotal scan links (when available) are listed in `VIRUSTOTAL.txt`.
